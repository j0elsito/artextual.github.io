<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropShare - Transferencia Directa y Segura</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        /* ESTILOS MODERNOS Y MINIMALISTAS (MODO OSCURO) */
        :root {
            --bg-principal: #0b0f19;
            --bg-tarjeta: #151d30;
            --azul-electrico: #0070f3;
            --azul-hover: #0051b3;
            --verde-exito: #00e676;
            --naranja-alerta: #ff9100;
            --texto-blanco: #ffffff;
            --texto-secundario: #94a3b8;
            --borde: #233554;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-blanco);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* CABECERA */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(45deg, #0070f3, #00dfd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 14px;
            color: var(--texto-secundario);
        }

        /* SECCIÓN DE IDENTIDAD (TU ID) */
        .id-section {
            background: rgba(0, 112, 243, 0.1);
            border: 1px solid rgba(0, 112, 243, 0.3);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .id-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--texto-secundario);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .id-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--texto-blanco);
            letter-spacing: 2px;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s;
        }
        .id-value:active {
            transform: scale(0.95);
        }

        /* BUSCADOR / CONEXIÓN */
        .connect-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .modern-input {
            flex: 1;
            background: #090d16;
            border: 1px solid var(--borde);
            border-radius: 14px;
            color: #fff;
            padding: 14px 16px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .modern-input:focus {
            border-color: var(--azul-electrico);
        }

        .modern-button {
            background: var(--azul-electrico);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 14px 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .modern-button:hover {
            background: var(--azul-hover);
        }
        .modern-button:active {
            transform: scale(0.98);
        }

        /* RADAR / ESTADO DE CONEXIÓN */
        .radar-zone {
            background: #090d16;
            border: 1px solid var(--borde);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 25px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Animación sutil de pulso para simular búsqueda */
        .radar-avatar {
            width: 50px;
            height: 50px;
            background: rgba(0, 112, 243, 0.2);
            border: 2px solid var(--azul-electrico);
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 0 0 0 rgba(0, 112, 243, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 112, 243, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 112, 243, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 112, 243, 0); }
        }

        .radar-status-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .radar-status-sub {
            font-size: 13px;
            color: var(--texto-secundario);
        }

        /* PANEL DE TRANSFERENCIA AUTOMÁTICO */
        .transfer-panel {
            display: none; /* Se activa al conectar */
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-label {
            background: linear-gradient(135deg, #233554 0%, #151d30 100%);
            border: 2px dashed var(--borde);
            border-radius: 16px;
            padding: 30px 20px;
            display: block;
            cursor: pointer;
            text-align: center;
            transition: border-color 0.2s, background 0.2s;
        }
        .file-label:hover {
            border-color: var(--azul-electrico);
            background: rgba(0, 112, 243, 0.05);
        }

        .file-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .file-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--texto-blanco);
        }

        #file-input {
            display: none;
        }

        .progress-container {
            margin-top: 15px;
            text-align: left;
        }

        .progress-bar-bg {
            background: #090d16;
            height: 8px;
            border-radius: 4px;
            width: 100%;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--azul-electrico);
            height: 100%;
            width: 0%;
            transition: width 0.1s ease;
        }

        /* ESPACIO PARA BANNER DE ANUNCIOS (PREPARADO PARA ADSTERRA) */
        .ad-container {
            margin-top: 25px;
            width: 100%;
            min-height: 60px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: rgba(255,255,255,0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>DropShare</h1>
            <p>Compartir archivos por P2P sin compresión</p>
        </div>

        <div class="id-section">
            <div class="id-label">Tu ID de conexión</div>
            <div class="id-value" id="my-peer-id" onclick="copiarMiID()">Cargando...</div>
        </div>

        <div class="connect-box">
            <input type="text" id="peer-id-input" class="modern-input" placeholder="Introduce el ID del destino...">
            <button class="modern-button" onclick="conectarConAmigo()">Conectar</button>
        </div>

        <div class="radar-zone" id="radar-container">
            <div class="radar-avatar" id="radar-icon">📡</div>
            <div class="radar-status-title" id="radar-title">Esperando Dispositivos</div>
            <div class="radar-status-sub" id="radar-sub">Introduce un ID arriba para sincronizar el canal.</div>
        </div>

        <div class="transfer-panel" id="transfer-zone">
            <label for="file-input" class="file-label">
                <div class="file-icon">📁</div>
                <div class="file-text" id="upload-instruction">Toca aquí para enviar fotos o videos</div>
            </label>
            <input type="file" id="file-input">
            
            <div class="progress-container">
                <div class="radar-status-sub" id="status-text">Listo para la transferencia directa.</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>
        </div>

        <div class="ad-container" id="ad-space">
            Anuncio Patrocinado
            </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        
        const CHUNK_SIZE = 65536; 
        let fileReader = new FileReader();
        let currentOffset = 0;
        let currentFile = null;

        const randomId = 'DROP-' + Math.floor(1000 + Math.random() * 9000);
        peer = new Peer(randomId);

        peer.on('open', (id) => {
            document.getElementById('my-peer-id').innerText = id;
        });

        peer.on('connection', (connection) => {
            conn = connection;
            configurarEventosConexion();
        });

        function conectarConAmigo() {
            const targetId = document.getElementById('peer-id-input').value.trim();
            if (!targetId) return alert('¡Introduce un ID válido!');
            
            document.getElementById('radar-title').innerText = "Estableciendo puente P2P...";
            conn = peer.connect(targetId);
            configurarEventosConexion();
        }

        function copiarMiID() {
            const idText = document.getElementById('my-peer-id').innerText;
            if(idText && idText !== "Cargando...") {
                navigator.clipboard.writeText(idText);
                alert("¡ID copiado al portapapeles!");
            }
        }

        function configurarEventosConexion() {
            let receivedChunks = [];
            let fileMeta = null;

            conn.on('open', () => {
                // Actualizamos la zona del radar para avisar el éxito en el enlace
                const radarIcon = document.getElementById('radar-icon');
                radarIcon.innerText = "⚡";
                radarIcon.style.animation = "none";
                radarIcon.style.background = "rgba(0, 230, 118, 0.1)";
                radarIcon.style.borderColor = "var(--verde-exito)";

                document.getElementById('radar-title').innerText = "¡Dispositivos Enlazados!";
                document.getElementById('radar-title').style.color = "var(--verde-exito)";
                document.getElementById('radar-sub').innerText = "Conectado de forma directa con: " + conn.peer;

                // Desplegamos el panel de control de archivos
                document.getElementById('transfer-zone').style.display = 'block';
            });

            conn.on('data', (data) => {
                const statusText = document.getElementById('status-text');
                const progressBar = document.getElementById('progress-bar');

                if (data.type === 'meta') {
                    receivedChunks = [];
                    fileMeta = data;
                    statusText.innerText = `Descargando: ${data.name}...`;
                    statusText.style.color = "var(--naranja-alerta)";
                    conn.send({ type: 'next' });
                    return;
                }

                if (data.type === 'next') {
                    enviarSiguienteFragmento();
                    return;
                }

                if (data.type === 'eof') {
                    const blob = new Blob(receivedChunks, { type: fileMeta.mime || 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileMeta.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    statusText.innerText = `¡${fileMeta.name} recibido al 100%!`;
                    statusText.style.color = "var(--verde-exito)";
                    progressBar.style.width = "100%";
                    progressBar.style.backgroundColor = "var(--verde-exito)";
                    receivedChunks = [];
                    return;
                }

                if (data instanceof ArrayBuffer || data.buffer instanceof ArrayBuffer) {
                    receivedChunks.push(data);
                    
                    // Calcular porcentaje de recepción simulado básico para el receptor
                    progressBar.style.width = "50%"; // Indicador de actividad
                    progressBar.style.backgroundColor = "var(--naranja-alerta)";
                    
                    conn.send({ type: 'next' });
                }
            });

            conn.on('close', () => {
                alert('La conexión directa se ha cerrado.');
                window.location.reload();
            });
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            currentFile = e.target.files[0];
            if (!currentFile || !conn) return;

            currentOffset = 0;
            const statusText = document.getElementById('status-text');
            statusText.innerText = `Analizando archivo...`;
            statusText.style.color = "var(--naranja-alerta)";

            conn.send({ 
                type: 'meta', 
                name: currentFile.name, 
                size: currentFile.size,
                mime: currentFile.type 
            });
        });

        function enviarSiguienteFragmento() {
            const statusText = document.getElementById('status-text');
            const progressBar = document.getElementById('progress-bar');
            
            if (currentOffset < currentFile.size) {
                const slice = currentFile.slice(currentOffset, currentOffset + CHUNK_SIZE);
                
                fileReader.onload = function(event) {
                    conn.send(event.target.result);
                    currentOffset += event.target.result.byteLength;
                    
                    const porcentaje = Math.floor((currentOffset / currentFile.size) * 100);
                    statusText.innerText = `Enviando archivo: ${porcentaje}%`;
                    statusText.style.color = "var(--azul-electrico)";
                    progressBar.style.width = `${porcentaje}%`;
                    progressBar.style.backgroundColor = "var(--azul-electrico)";
                };
                
                fileReader.readAsArrayBuffer(slice);
            } else {
                conn.send({ type: 'eof' });
                statusText.innerText = `¡${currentFile.name} enviado con éxito!`;
                statusText.style.color = "var(--verde-exito)";
                progressBar.style.width = "100%";
                progressBar.style.backgroundColor = "var(--verde-exito)";
            }
        }
    </script>
</body>
</html>
