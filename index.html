<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TechExchange Video Editor</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VideoEditor">
    <link rel="apple-touch-icon" href="icono-ios.png">

    <link rel="manifest" href="manifest.json">

    <style>
        html, body {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0c0c0e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overscroll-behavior: none;
        }

        * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            background-color: #16161a;
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: 12px;
            text-align: center;
            border-bottom: 1px solid #232329;
        }

        .header h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #e5e5ea;
        }

        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background-color: #000000;
        }

        #video-canvas {
            max-width: 100%;
            max-height: 85%;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            background-color: #111115;
        }

        #source-video {
            display: none;
        }

        /* Contenedor de herramientas superior (NUEVO: Para importar archivos) */
        .import-bar {
            display: flex;
            justify-content: center;
            padding: 10px;
            background-color: #16161a;
            border-bottom: 1px solid #232329;
        }

        /* Ocultamos el input de archivo nativo que es feo */
        #file-input {
            display: none;
        }

        /* Creamos un botón personalizado bonito para iOS */
        .btn-import {
            background-color: #34c759; /* Verde nativo de iOS */
            color: #ffffff;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.3);
        }

        .toolbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 16px 12px;
            background-color: #16161a;
            border-top: 1px solid #232329;
        }

        .btn {
            background-color: #2c2c35;
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .btn:active, .btn-import:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        #btn-play {
            background-color: #007aff;
            min-width: 85px;
        }
        
        #btn-play.playing {
            background-color: #ff3b30;
        }

        .timeline-container {
            background-color: #16161a;
            padding: 12px 16px;
            padding-bottom: calc(env(safe-area-inset-bottom, 12px) + 8px);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timeline-container span {
            font-size: 12px;
            color: #8e8e93;
            font-family: -apple-system-font, monospace;
        }

        #timeline-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #3a3a3c;
            outline: none;
        }

        #timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #007aff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h2>EDITOR DE VIDEO PRO</h2>
        </header>

        <div class="import-bar">
            <label for="file-input" class="btn-import">📁 Seleccionar Video</label>
            <input type="file" id="file-input" accept="video/*">
        </div>

        <div class="preview-area">
            <video id="source-video" playsinline webkit-playsinline loop muted></video>
            <canvas id="video-canvas"></canvas>
        </div>

        <div class="toolbar">
            <button class="btn" id="btn-play">▶ Play</button>
            <button class="btn btn-filter" data-filter="normal">Original</button>
            <button class="btn btn-filter" data-filter="bw">B&N</button>
            <button class="btn btn-filter" data-filter="invert">Invertido</button>
        </div>

        <div class="timeline-container">
            <span id="current-time">00:00</span>
            <input type="range" id="timeline-slider" min="0" max="100" value="0">
            <span id="total-time">00:00</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('source-video');
        const canvas = document.getElementById('video-canvas');
        const ctx = canvas.getContext('2d');

        const fileInput = document.getElementById('file-input');
        const btnPlay = document.getElementById('btn-play');
        const slider = document.getElementById('timeline-slider');
        const currentTimeLabel = document.getElementById('current-time');
        const totalTimeLabel = document.getElementById('total-time');
        const filterButtons = document.querySelectorAll('.btn-filter');

        let currentFilter = 'normal';

        // NUEVO: Escuchar cuando el usuario seleccione un video
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Pausar reproducción actual si la hay
                video.pause();
                btnPlay.textContent = "▶ Play";
                btnPlay.classList.remove('playing');

                // Crear una URL local y segura para el archivo multimedia seleccionado
                const fileURL = URL.createObjectURL(file);
                video.src = fileURL;
                video.load(); // Forzar la carga del nuevo video
            }
        });

        // Sincroniza las dimensiones cuando el video está listo en memoria
        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            totalTimeLabel.textContent = formatTime(video.duration);
            slider.max = Math.floor(video.duration);
            slider.value = 0;
            currentTimeLabel.textContent = "00:00";
            drawFrame(); 
        });

        // Alternar reproducción
        btnPlay.addEventListener('click', () => {
            // Evitar reproducir si no hay un video cargado aún
            if (!video.src) {
                alert("Por favor, selecciona un video primero.");
                return;
            }

            if (video.paused) {
                video.play();
                btnPlay.textContent = "⏸ Pause";
                btnPlay.classList.add('playing');
                renderLoop();
            } else {
                video.pause();
                btnPlay.textContent = "▶ Play";
                btnPlay.classList.remove('playing');
            }
        });

        function renderLoop() {
            if (video.paused || video.ended) return;
            drawFrame();
            updateTimeline();
            requestAnimationFrame(renderLoop);
        }

        function drawFrame() {
            // Solo dibuja si el video tiene dimensiones válidas
            if (video.videoWidth === 0) return;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            if (currentFilter !== 'normal') {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i+1];
                    let b = data[i+2];
                    
                    if (currentFilter === 'bw') {
                        let grey = (r + g + b) / 3;
                        data[i] = grey;     
                        data[i+1] = grey;   
                        data[i+2] = grey;   
                    } else if (currentFilter === 'invert') {
                        data[i] = 255 - r;
                        data[i+1] = 255 - g;
                        data[i+2] = 255 - b;
                    }
                }
                ctx.putImageData(imageData, 0, 0);
            }
        }

        filterButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                currentFilter = e.target.getAttribute('data-filter');
                if (video.paused) drawFrame(); 
            });
        });

        function updateTimeline() {
            slider.value = Math.floor(video.currentTime);
            currentTimeLabel.textContent = formatTime(video.currentTime);
        }

        slider.addEventListener('input', () => {
            if (!video.src) return;
            video.currentTime = slider.value;
            currentTimeLabel.textContent = formatTime(video.currentTime);
            if (video.paused) drawFrame();
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            let min = Math.floor(seconds / 60);
            let sec = Math.floor(seconds % 60);
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA: Ready.'))
                    .catch(err => console.log('PWA: Error.', err));
            });
        }
    </script>
</body>
</html>
