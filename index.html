<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftShare - Transferencia Directa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
        }

        body {
            background-color: #2c2c2c;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                              url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .menu-container {
            width: 100%;
            max-width: 600px;
            background-color: rgba(0, 0, 0, 0.4);
            border: 4px solid #4a4a4a;
            outline: 4px solid #000000;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 8px;
        }

        .tab {
            flex: 1;
            background: #4a4a4a;
            border: 3px solid #7a7a7a;
            border-bottom: none;
            color: #aaaaaa;
            padding: 12px 5px;
            text-align: center;
            font-size: 10px;
            cursor: not-allowed;
            text-shadow: 2px 2px #000;
        }

        .tab.active {
            background: #7a7a7a;
            border: 3px solid #ffffff;
            border-bottom: none;
            color: #ffffff;
            cursor: pointer;
        }

        .section-title {
            font-size: 11px;
            color: #e0e0e0;
            margin-bottom: 12px;
            text-shadow: 2px 2px #000;
        }

        /* CONFIGURACIÓN DE TU ID */
        .my-id-box {
            background: #1a1a1a;
            border: 3px dashed #7a7a7a;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 9px;
            color: #ffff55;
            text-align: center;
            word-break: break-all;
        }

        /* CONEXIÓN MANUAL/BUSCADOR */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .mc-input {
            flex: 1;
            background: #000;
            border: 3px solid #4a4a4a;
            color: #fff;
            padding: 10px;
            font-size: 10px;
            outline: none;
        }
        .mc-input:focus {
            border-color: #fff;
        }

        /* LISTA DE AMIGOS */
        .friends-list {
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid #1a1a1a;
            min-height: 120px;
            padding: 10px;
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .friend-item {
            background: #4a4a4a;
            border: 3px solid #2a2a2a;
            border-bottom-color: #111;
            border-right-color: #111;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .friend-item:hover {
            background: #5a5a5a;
            border-color: #ffffff;
        }

        .friend-info h3 {
            font-size: 11px;
            color: #55ff55;
            text-shadow: 2px 2px #000;
            margin-bottom: 4px;
        }

        .ping-indicator {
            width: 16px;
            height: 16px;
            background: #55ff55;
            border: 2px solid #000;
            box-shadow: inset -2px -2px #00aa00;
        }

        /* PANEL DE TRANSFERENCIA */
        .transfer-panel {
            background: #2a2a2a;
            border: 4px solid #111;
            padding: 15px;
            text-align: center;
            display: none;
        }

        .transfer-panel h4 {
            font-size: 10px;
            margin-bottom: 15px;
            color: #ffff55;
        }

        /* BOTONES MINECRAFT */
        .mc-button {
            background: #7c7c7c;
            border: 3px solid #ffffff;
            border-bottom-color: #373737;
            border-right-color: #373737;
            color: #e0e0e0;
            padding: 12px;
            font-size: 10px;
            text-align: center;
            text-shadow: 2px 2px #000;
            cursor: pointer;
            width: 100%;
            display: inline-block;
            box-sizing: border-box;
        }

        .mc-button:hover {
            background: #8c8c8c;
            color: #ffffff;
        }

        .mc-button:active {
            background: #4a4a4a;
            border: 3px solid #373737;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
        }

        .btn-small {
            width: auto;
            padding: 10px 15px;
        }

        #file-input {
            display: none;
        }

        .status-msg {
            font-size: 8px;
            color: #aaa;
            margin-top: 10px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <div class="tabs">
            <div class="tab">Mundos</div>
            <div class="tab active">Amigos</div>
            <div class="tab">Servidores</div>
        </div>

        <div class="section-title">Tu ID de Mundo (Este dispositivo)</div>
        <div class="my-id-box" id="my-peer-id">Generando tu ID...</div>

        <div class="section-title">Unirse al Mundo de un Amigo</div>
        <div class="search-box">
            <input type="text" id="peer-id-input" class="mc-input" placeholder="Introduce el ID de tu amigo...">
            <button class="mc-button btn-small" onclick="conectarConAmigo()">Conectar</button>
        </div>

        <div class="section-title">Conexiones Activas</div>
        <div class="friends-list" id="friends-container">
            <div class="status-msg" id="no-friends-msg">No hay amigos enlazados aún.</div>
        </div>

        <div class="transfer-panel" id="transfer-zone">
            <h4 id="connected-title">Conectado con: Ninguno</h4>
            <label for="file-input" class="mc-button">Seleccionar Archivo</label>
            <input type="file" id="file-input">
            <div class="status-msg" id="status-text">Listo para enviar archivos sin compresión.</div>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        const CHUNK_SIZE = 16384; // 16KB por paquete para evitar saturar la memoria

        // 1. INICIALIZAR PEERJS (Conexión automática con el servidor de señales)
        // Generamos un ID corto aleatorio parecido a los códigos de amigos
        const randomId = 'CRAFT-' + Math.floor(1000 + Math.random() * 9000);
        peer = new Peer(randomId);

        // Mostrar tu ID en pantalla cuando el servidor responda
        peer.on('open', (id) => {
            document.getElementById('my-peer-id').innerText = id;
            console.log('Tu ID de PeerJS es: ' + id);
        });

        // 2. ESCUCHAR CONEXIONES ENTRANTES (Si el otro dispositivo introduce tu ID)
        peer.on('connection', (connection) => {
            conn = connection;
            configurarEventosConexion();
        });

        // 3. FUNCIÓN PARA LLAMAR A OTRO DISPOSITIVO (Si tú introduces su ID)
        function conectarConAmigo() {
            const targetId = document.getElementById('peer-id-input').value.trim();
            if (!targetId) return alert('¡Introduce un ID válido!');
            
            document.getElementById('no-friends-msg').innerText = "Conectando...";
            conn = peer.connect(targetId);
            configurarEventosConexion();
        }

        // 4. LOGÍSTICA DE LA CONEXIÓN Y LOGS EN PANTALLA
        function configurarEventosConexion() {
            conn.on('open', () => {
                // Actualizar Interfaz estilo Minecraft
                document.getElementById('no-friends-msg').style.display = 'none';
                
                const container = document.getElementById('friends-container');
                container.innerHTML = `
                    <div class="friend-item">
                        <div class="friend-info">
                            <h3>${conn.peer}</h3>
                            <p>¡Mundo sincronizado en directo!</p>
                        </div>
                        <div class="ping-indicator"></div>
                    </div>
                `;

                document.getElementById('transfer-zone').style.display = 'block';
                document.getElementById('connected-title').innerText = "Conectado con: " + conn.peer;
                document.getElementById('status-text').innerText = "Vínculo directo establecido. Elige un archivo.";
                document.getElementById('status-text').style.color = "#55ff55";
            });

            // ESCUCHAR CUANDO TE MANDAN UN ARCHIVO
            let receivedChunks = [];
            let fileMeta = null;

            conn.on('data', (data) => {
                // Comprobar si son metadatos del archivo (Nombre y Tamaño)
                if (data.type === 'meta') {
                    receivedChunks = [];
                    fileMeta = data;
                    document.getElementById('status-text').innerText = `Recibiendo: ${data.name}...`;
                    document.getElementById('status-text').style.color = "#ffaa00";
                    return;
                }

                // Comprobar si es el final del archivo
                if (data.type === 'eof') {
                    const blob = new Blob(receivedChunks);
                    const url = URL.createObjectURL(blob);
                    
                    // Crear un enlace de descarga automática estilo Minecraft
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileMeta.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    document.getElementById('status-text').innerText = `¡${fileMeta.name} guardado con éxito!`;
                    document.getElementById('status-text').style.color = "#55ff55";
                    receivedChunks = [];
                    return;
                }

                // Si son fragmentos de datos puros, acumularlos
                receivedChunks.push(data);
            });

            conn.on('close', () => {
                alert('La conexión se ha perdido.');
                window.location.reload();
            });
        }

        // 5. ENVIAR EL ARCHIVO EN PEDAZOS (CHUNKS)
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !conn) return;

            const status = document.getElementById('status-text');
            status.innerText = `Preparando "${file.name}"...`;
            status.style.color = "#ffaa00";

            // Enviar Metadatos primero
            conn.send({ type: 'meta', name: file.name, size: file.size });

            const reader = new FileReader();
            let offset = 0;

            reader.onload = function(event) {
                // Enviar fragmento binario
                conn.send(event.target.result);
                offset += event.target.result.byteLength;

                // Si falta archivo por leer, continuar
                if (offset < file.size) {
                    status.innerText = `Enviando: ${Math.floor((offset / file.size) * 100)}%`;
                    readNextChunk();
                } else {
                    // Fin del archivo
                    conn.send({ type: 'eof' });
                    status.innerText = `¡${file.name} enviado correctamente!`;
                    status.style.color = "#55ff55";
                }
            };

            function readNextChunk() {
                const slice = file.slice(offset, offset + CHUNK_SIZE);
                reader.readAsArrayBuffer(slice);
            }

            // Iniciar lectura
            readNextChunk();
        });
    </script>
</body>
</html>
