<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TechExchange Video Editor</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VideoEditor">
    <link rel="apple-touch-icon" href="icono-ios.png">
    <link rel="manifest" href="manifest.json">

    <style>
        /* ==========================================
           1. ESTILOS INTERFAZ ACTUALIZADA
           ========================================== */
        html, body {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0c0c0e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            overscroll-behavior: none;
        }

        * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            background-color: #16161a;
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid #232329;
        }

        .header h2 { margin: 0; font-size: 14px; color: #a1a1aa; }

        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background-color: #000000;
            position: relative;
        }

        #video-canvas {
            max-width: 100%;
            max-height: 75%;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            background-color: #1a1a1f;
        }

        /* Indicador de proceso de exportación overlay */
        .export-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 8px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #34c759;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .workspace {
            background-color: #16161a;
            border-top: 1px solid #232329;
            display: flex;
            flex-direction: column;
        }

        .top-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #232329;
            gap: 10px;
        }

        .btn-add {
            background-color: #34c759;
            color: white; border: none; padding: 6px 12px;
            border-radius: 15px; font-size: 12px; font-weight: 600;
        }
        #file-input { display: none; }

        .btn-play {
            background-color: #007aff;
            color: white; border: none; padding: 6px 20px;
            border-radius: 15px; font-size: 12px; font-weight: 600;
        }
        .btn-play.playing { background-color: #ff3b30; }

        /* NUEVO: Botón de exportación estilo iOS */
        .btn-export {
            background-color: #5856d6; /* Púrpura */
            color: white; border: none; padding: 6px 14px;
            border-radius: 15px; font-size: 12px; font-weight: 600;
        }

        /* NUEVA: Barra de reproducción interactiva (Estilo YouTube/TikTok) */
        .global-progressbar-container {
            padding: 10px 16px 0 16px;
            background-color: #1c1c22;
            display: flex;
            align-items: center;
        }

        .scrubber-range {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #3a3a3c;
            outline: none;
            margin: 0;
            cursor: pointer;
        }

        /* La bolita interactiva roja que marca el presente */
        .scrubber-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff3b30; /* Rojo TikTok/YouTube */
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .scrubber-range::-webkit-slider-thumb:active {
            transform: scale(1.3);
        }

        .timeline-track-container {
            padding: 15px 10px;
            background-color: #1c1c22;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 6px;
            align-items: center;
            min-height: 70px;
        }

        .timeline-clip {
            display: inline-block;
            height: 44px;
            background: linear-gradient(145deg, #3a3a4c, #2e2e3d);
            border: 1px solid #4a4a5a;
            border-radius: 6px;
            padding: 0 10px;
            color: #fff;
            font-size: 11px;
            font-weight: 500;
            line-height: 42px;
            position: relative;
            min-width: 60px;
        }

        .timeline-clip.selected {
            border: 2px solid #007aff;
            background: linear-gradient(145deg, #007aff, #0051a8);
        }

        .clip-inspector {
            background-color: #111115;
            padding: 10px 15px;
            display: none;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #232329;
        }

        .inspector-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }

        .inspector-controls input[type="range"] { width: 90px; }

        .btn-danger {
            background-color: #ff3b30;
            color: white; border: none; padding: 6px 14px;
            border-radius: 12px; font-size: 11px; font-weight: bold;
        }

        .time-display {
            padding: 6px 15px;
            font-size: 11px;
            color: #8e8e93;
            font-family: monospace;
            background-color: #16161a;
            text-align: center;
            padding-bottom: calc(env(safe-area-inset-bottom, 10px) + 5px);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h2>TIMELINE VIDEO EDITOR PRO</h2>
        </header>

        <div class="preview-area">
            <div class="export-overlay" id="export-screen">
                <div class="spinner"></div>
                <div id="export-text">Procesando y Exportando Video...</div>
            </div>
            <canvas id="video-canvas"></canvas>
        </div>

        <div class="workspace">
            
            <div class="top-toolbar">
                <label for="file-input" class="btn-add">+ Media</label>
                <input type="file" id="file-input" accept="video/*, image/*" multiple>
                
                <button class="btn-play" id="global-play">▶ Play</button>
                <button class="btn-export" id="btn-export">💾 Exportar</button>
            </div>

            <div class="global-progressbar-container">
                <input type="range" class="scrubber-range" id="global-scrubber" min="0" max="100" step="0.05" value="0">
            </div>

            <div class="timeline-track-container" id="timeline-track"></div>

            <div class="clip-inspector" id="inspector-panel">
                <div class="inspector-controls">
                    <span id="inspector-clip-name">Clip</span>
                    <label>Duración:</label>
                    <input type="range" id="clip-duration-slider" min="1" max="30" step="0.5">
                    <span id="clip-duration-text">5s</span>
                </div>
                <button class="btn-danger" id="btn-delete-clip">🗑 Borrar</button>
            </div>

            <div class="time-display">
                <span id="global-time">00:00.0</span> / Total: <span id="total-time">00:00.0</span>
            </div>

        </div>
    </div>

    <script>
        /* ==========================================
           2. MOTOR LÓGICO DEL EDITOR EN JAVASCRIPT
           ========================================== */
        const canvas = document.getElementById('video-canvas');
        const ctx = canvas.getContext('2d');
        
        const fileInput = document.getElementById('file-input');
        const timelineTrack = document.getElementById('timeline-track');
        const btnPlay = document.getElementById('global-play');
        const btnExport = document.getElementById('btn-export');
        const globalScrubber = document.getElementById('global-scrubber');
        const globalTimeLabel = document.getElementById('global-time');
        const totalTimeLabel = document.getElementById('total-time');
        
        // Elementos de Exportación e Inspector
        const exportScreen = document.getElementById('export-screen');
        const exportText = document.getElementById('export-text');
        const inspectorPanel = document.getElementById('inspector-panel');
        const inspectorName = document.getElementById('inspector-clip-name');
        const durationSlider = document.getElementById('clip-duration-slider');
        const durationText = document.getElementById('clip-duration-text');
        const btnDeleteClip = document.getElementById('btn-delete-clip');

        let playlist = []; 
        let selectedIndex = null; 
        let globalTime = 0; 
        let totalDuration = 0; 
        let isPlaying = false;
        let lastFrameTime = 0;

        canvas.width = 1280;
        canvas.height = 720;
        clearCanvas();

        // --- 1. CARGAR ARCHIVOS ---
        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            
            files.forEach(file => {
                const isVideo = file.type.startsWith('video/');
                const isImage = file.type.startsWith('image/');
                if (!isVideo && !isImage) return;

                const element = isVideo ? document.createElement('video') : document.createElement('img');
                element.src = URL.createObjectURL(file);

                const newClip = {
                    id: Date.now() + Math.random(),
                    name: file.name.substring(0, 8) + "..",
                    type: isVideo ? 'video' : 'image',
                    element: element,
                    duration: 5.0, 
                    loaded: false
                };

                if (isVideo) {
                    element.muted = true; element.playsInline = true; element.webkitPlaysInline = true;
                    element.addEventListener('loadedmetadata', () => {
                        newClip.duration = element.duration;
                        newClip.loaded = true;
                        recalculateTimeline();
                    });
                } else {
                    element.onload = () => {
                        newClip.loaded = true;
                        recalculateTimeline();
                    };
                }
                playlist.push(newClip);
            });
            fileInput.value = "";
            recalculateTimeline();
        });

        // --- 2. GESTIÓN DE LA LÍNEA DE TIEMPO ---
        function recalculateTimeline() {
            totalDuration = 0;
            timelineTrack.innerHTML = "";

            playlist.forEach((clip, index) => {
                totalDuration += parseFloat(clip.duration);

                const clipBlock = document.createElement('div');
                clipBlock.className = `timeline-clip ${index === selectedIndex ? 'selected' : ''}`;
                clipBlock.style.width = `${Math.max(65, clip.duration * 12)}px`;
                clipBlock.textContent = `${clip.name} (${clip.duration.toFixed(1)}s)`;
                clipBlock.addEventListener('click', () => selectClip(index));
                timelineTrack.appendChild(clipBlock);
            });

            totalTimeLabel.textContent = formatTime(totalDuration);
            globalScrubber.max = totalDuration; // Sincroniza el límite de la bolita roja
            
            updateInspector();
            renderCurrentFrame();
        }

        function selectClip(index) {
            selectedIndex = (selectedIndex === index) ? null : index;
            recalculateTimeline();
        }

        function updateInspector() {
            if (selectedIndex !== null && playlist[selectedIndex]) {
                const clip = playlist[selectedIndex];
                inspectorPanel.style.display = 'flex';
                inspectorName.textContent = clip.type === 'video' ? '📹 Video' : '🖼 Foto';
                durationSlider.max = (clip.type === 'video' && clip.element.duration) ? clip.element.duration : 30;
                durationSlider.value = clip.duration;
                durationText.textContent = `${parseFloat(clip.duration).toFixed(1)}s`;
            } else {
                inspectorPanel.style.display = 'none';
            }
        }

        durationSlider.addEventListener('input', (e) => {
            if (selectedIndex !== null && playlist[selectedIndex]) {
                playlist[selectedIndex].duration = parseFloat(e.target.value);
                durationText.textContent = `${playlist[selectedIndex].duration.toFixed(1)}s`;
                recalculateTimeline();
            }
        });

        btnDeleteClip.addEventListener('click', () => {
            if (selectedIndex !== null) {
                playlist.splice(selectedIndex, 1);
                selectedIndex = null;
                if (globalTime > totalDuration) globalTime = 0;
                recalculateTimeline();
            }
        });

        // --- 3. NUEVO: INTERACTIVIDAD DE LA BOLITA (SCRUBBER ESTILO TIKTOK) ---
        globalScrubber.addEventListener('input', (e) => {
            globalTime = parseFloat(e.target.value);
            globalTimeLabel.textContent = formatTime(globalTime);
            renderCurrentFrame(); // Muestra el cuadro exacto mientras arrastras el dedo
        });

        // --- 4. SISTEMA DE REPRODUCCIÓN GLOBAL ---
        btnPlay.addEventListener('click', () => {
            if (playlist.length === 0) return;
            isPlaying = !isPlaying;
            if (isPlaying) {
                btnPlay.textContent = "⏸ Pause";
                btnPlay.classList.add('playing');
                lastFrameTime = performance.now();
                requestAnimationFrame(playbackLoop);
            } else {
                btnPlay.textContent = "▶ Play";
                btnPlay.classList.remove('playing');
            }
        });

        function playbackLoop(now) {
            if (!isPlaying) return;

            let deltaTime = (now - lastFrameTime) / 1000;
            lastFrameTime = now;
            globalTime += deltaTime;

            if (globalTime >= totalDuration) globalTime = 0;

            globalTimeLabel.textContent = formatTime(globalTime);
            globalScrubber.value = globalTime; // Desplaza la bolita en sincronía con el video
            renderCurrentFrame();

            requestAnimationFrame(playbackLoop);
        }

        function renderCurrentFrame() {
            if (playlist.length === 0) { clearCanvas(); return; }

            let accumulatedTime = 0;
            let targetClip = null;
            let internalTime = 0;

            for (let i = 0; i < playlist.length; i++) {
                const clip = playlist[i];
                if (globalTime >= accumulatedTime && globalTime <= (accumulatedTime + clip.duration)) {
                    targetClip = clip;
                    internalTime = globalTime - accumulatedTime;
                    break;
                }
                accumulatedTime += clip.duration;
            }

            if (!targetClip) {
                targetClip = playlist[playlist.length - 1];
                internalTime = targetClip.duration;
            }

            if (targetClip && targetClip.loaded) {
                if (targetClip.type === 'video') {
                    targetClip.element.currentTime = internalTime;
                    ctx.drawImage(targetClip.element, 0, 0, canvas.width, canvas.height);
                } else if (targetClip.type === 'image') {
                    ctx.drawImage(targetClip.element, 0, 0, canvas.width, canvas.height);
                }
            }
        }

        // --- 5. NUEVO: BOTÓN DE EXPORTACIÓN DIRECTA (MEDIARECORDER API) ---
        btnExport.addEventListener('click', async () => {
            if (playlist.length === 0) return;
            
            // Pausar cualquier reproducción activa
            isPlaying = false;
            btnPlay.textContent = "▶ Play";
            btnPlay.classList.remove('playing');

            // Mostrar pantalla de carga integrada en la PWA
            exportScreen.style.display = 'flex';
            globalTime = 0;

            // Capturar la pista de video del Canvas a 30 FPS
            const stream = canvas.captureStream(30);
            
            // Forzar formatos altamente compatibles con iOS (.mp4 o contenedores webm)
            const options = { mimeType: 'video/webm;codecs=vp8' };
            let recorder;
            try {
                recorder = new MediaRecorder(stream, options);
            } catch(e) {
                recorder = new MediaRecorder(stream); // Fallback automático de Apple
            }

            const chunks = [];
            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

            recorder.onstop = () => {
                // Generar el archivo multimedia final descargable en memoria
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                
                // Forzar descarga automática directa en el iPhone
                const a = document.createElement('a');
                a.href = url;
                a.download = `TechExchange_Edit_${Date.now()}.mp4`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                // Ocultar pantalla de carga
                exportScreen.style.display = 'none';
                globalTime = 0;
                recalculateTimeline();
            };

            recorder.start();

            // Renderizar la línea de tiempo frame por frame a máxima velocidad para la grabación
            const exportInterval = 1 / 30; // 30 fotogramas por segundo
            while (globalTime < totalDuration) {
                globalTime += exportInterval;
                renderCurrentFrame();
                // Esperar un instante corto para dar tiempo al Canvas a actualizar sus pixeles antes del siguiente frame
                await new Promise(r => setTimeout(r, 33)); 
            }

            recorder.stop();
        });

        function clearCanvas() {
            ctx.fillStyle = '#111115'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#444452'; ctx.font = '26px -apple-system'; ctx.textAlign = 'center';
            ctx.fillText('Línea de tiempo vacía', canvas.width / 2, canvas.height / 2);
        }

        function formatTime(seconds) {
            let min = Math.floor(seconds / 60); let sec = Math.floor(seconds % 60);
            let ms = Math.floor((seconds % 1) * 10);
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${ms}`;
        }
    </script>
</body>
</html>
